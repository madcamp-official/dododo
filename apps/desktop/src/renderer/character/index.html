<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DoDoDo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="desktop-shell" aria-label="DoDoDo 캐릭터 도우미">
      <aside class="notification-bubble" data-notification-bubble hidden aria-live="assertive">
        <div class="notification-bubble-header">
          <strong data-notification-kind>알림</strong>
          <button class="notification-close" type="button" data-dismiss-notification aria-label="알림 닫기">×</button>
        </div>
        <p data-notification-message></p>
        <button class="notification-detail" type="button" data-notification-detail hidden>자세히 보기</button>
      </aside>

      <section class="panel" data-panel hidden aria-live="polite">
        <header class="panel-header">
          <div>
            <p class="eyebrow">DoDoDo</p>
            <h1 data-panel-title>오늘 할 일</h1>
          </div>
          <button class="icon-button" type="button" data-close-panel aria-label="패널 닫기">×</button>
        </header>
        <div class="panel-content" data-panel-content></div>
      </section>

      <nav class="popup-menu" data-popup-menu hidden aria-label="DoDoDo 메뉴">
        <button type="button" data-view="today"><span>✓</span>오늘 할 일</button>
        <button type="button" data-view="calendar"><span>▦</span>이번 주</button>
        <button type="button" data-view="inbox"><span>★</span>추천</button>
        <button type="button" data-view="ask"><span>?</span>물어보기</button>
        <button type="button" data-view="add"><span>＋</span>추가</button>
        <button type="button" data-action="study"><span>●</span>같이 공부하기</button>
        <button type="button" data-action="sync"><span>↻</span>동기화</button>
        <button type="button" data-view="settings"><span>⚙</span>설정</button>
      </nav>

      <div class="character-button" data-character>
        <img
          class="character"
          src="../../../resources/character/idle.png"
          alt="DoDoDo 도토리 캐릭터"
          draggable="false"
        />
        <button class="menu-toggle" type="button" data-menu-toggle aria-label="DoDoDo 메뉴 열기">☰</button>
        <button class="notification-badge" type="button" data-notification-badge hidden aria-label="새 알림 보기">0</button>
      </div>
    </main>
    <script type="module" src="./mascot.js"></script>
  </body>
</html>
