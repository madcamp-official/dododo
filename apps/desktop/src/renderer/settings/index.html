<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DoDoDo 설정</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="settings-shell">
      <aside class="settings-sidebar">
        <div class="brand"><span aria-hidden="true">●</span><div><strong>DoDoDo</strong><small>설정</small></div></div>
        <nav aria-label="설정 메뉴">
          <button type="button" data-settings-tab="profile" aria-current="page">프로필</button>
          <button type="button" data-settings-tab="schedule">일정 관리</button>
          <button type="button" data-settings-tab="calendar">캘린더</button>
          <button type="button" data-settings-tab="source">Source 관리</button>
        </nav>
      </aside>
      <section class="settings-main">
        <header><p>DoDoDo Desktop</p><h1 data-settings-title>프로필</h1></header>
        <div class="settings-content" data-settings-content></div>
      </section>
    </main>
    <script type="module" src="./settings.js"></script>
  </body>
</html>
